name: jungle-wallet

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle
      POSTGRES_DB: jungle_wallet
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wallet"]
      interval: 2s
      timeout: 3s
      retries: 30

  # LocalStack is pinned to a 4.x community tag that runs without an auth token.
  localstack:
    image: localstack/localstack:4.7.0
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path
    ports:
      - "4566:4566"
    volumes:
      - localstack:/var/lib/localstack
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      # checks the SQS service itself (does not depend on the init script being executable)
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -Eq '\"sqs\": \"(available|running)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Optional: three app instances on ports 3001-3003 (docker compose --profile app up -d --build)
  app:
    profiles: ["app"]
    build: .
    deploy:
      replicas: 3
    environment:
      DATABASE_URL: postgresql://jungle:jungle@postgres:5432/jungle_wallet
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOG_LEVEL: info
    ports:
      - "3001-3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

volumes:
  pgdata:
  localstack:
